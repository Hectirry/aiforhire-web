<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Página no encontrada | AI Hire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #00B26A;
      --ink: #0A0A0A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { text-align: center; max-width: 480px; }
    .code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      color: var(--accent);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-top: 16px;
    }
    p {
      margin-top: 12px;
      color: #555555;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 28px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    .btn:hover { background: #009a5c; }
    .brand {
      margin-top: 40px;
      font-size: 14px;
      color: #999999;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o fue movida. Vuelve al inicio para conocer cómo implementamos IA en tu empresa en 2 semanas.</p>
    <a class="btn" href="https://aiforhire.app/">Volver al inicio</a>
    <div class="brand">AI Hire — aiforhire.app</div>
  </main>
</body>
</html>
